<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BREACH — a Standardvibeware game</title>
<meta name="description" content="BREACH — a radial bullet hell. The ring is the health bar. Produced by Standardvibeware.">
<meta property="og:title" content="BREACH">
<meta property="og:description" content="A radial bullet hell where the ring is the health bar. Produced by Standardvibeware.">
<meta property="og:site_name" content="Standardvibeware">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #05040a; overflow: hidden;
    /* The whole page is a touch controller: no panning, zooming, rubber-banding,
       text selection, or iOS long-press callout anywhere on it. */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  body { display: grid; place-items: center; }
  #frame { position: relative; line-height: 0; }
  canvas {
    display: block;
    background: #07060e;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    touch-action: none;
  }
  #scan {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,.22) 0 1px, rgba(0,0,0,0) 1px 3px);
  }
  #vign {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 70px 18px rgba(0,0,0,.8);
  }
  /* Pause control for phones (no P key). Game code shows it only on coarse
     pointers while playing or paused; taps on it never reach the touch zones. */
  #pauseBtn {
    position: fixed; top: 10px; right: 10px;
    width: 44px; height: 44px; padding: 0;
    border: 1px solid #3a3550; border-radius: 6px;
    background: rgba(10,8,20,.55); color: #9a94b8;
    font: 700 18px/1 system-ui, sans-serif;
    display: none;
    touch-action: manipulation;
  }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="cv" width="320" height="320"></canvas>
    <div id="scan"></div>
    <div id="vign"></div>
  </div>
  <button id="pauseBtn" aria-label="Pause">II</button>
  <script src="src/font.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
